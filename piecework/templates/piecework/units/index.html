{% extends "piecework/base.html" %}

{% block body %}
<h1 class="my-4">Units</h1>

<div class="row g-3">
    {% for unit in units %}
    <div class="col-12 col-md-6 col-xl-4">
        <div class="card h-100">
            <div class="card-body">
                <p>
                    <span class="text-muted text-info-emphasis">Unit:</span>
                    <br>
                    {{ unit.number }}
                </p>
                <p>
                    <span class="text-muted text-info-emphasis">Status:</span>
                    <br>
                    {{ unit.get_status_display }}
                </p>
            </div>
            <div class="card-footer d-flex">
                <form action="{% url 'piecework:units_delete' unit.pk %}" method="post" class="w-50"
                    onsubmit="return confirm('Delete unit {{unit.number|escapejs}}?')">
                    {% csrf_token %}

                    <button class="btn btn-danger w-100" aria-label="Delete unit {{unit.number}}">
                        <i class="bi bi-trash fs-3" aria-hidden="true"></i>
                    </button>
                </form>
                <a href="#EDIT" class="btn btn-info w-50" aria-label="Edit unit {{ unit.number }}">
                    <i class="bi bi-pen fs-3" aria-hidden="true"></i>
                </a>
            </div>
        </div>
    </div>
    {% empty %}
    <p class="text-muted">No units found.</p>
    {% endfor %}
</div>
{% endblock body %}
