{% extends "piecework/base.html" %}
{% load crispy_forms_tags %}

{% block body %}
<div class="card mt-4">
    <div class="card-header">
        <h1 class="h3 text-center">Edit unit {{ unit.number }}</h1>
    </div>

    <div class="card-body">
        <form method="post">
            {% csrf_token %}

            {% if form.non_field_errors %}
            <div class="alert alert-danger" role="alert">
                {% for error in form.non_field_errors %}
                <div>{{ error }}</div>
                {% endfor %}
            </div>
            {% endif %}

            {{ form|crispy }}

            <button class="btn btn-primary w-100">
                Save changes
            </button>

            <a href="{% url 'piecework:units_detail' unit.pk %}" class="btn btn-outline-secondary w-100">
                Cancel
            </a>
        </form>
    </div>
</div>
{% endblock body %}
